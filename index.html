    <script>
        const assetFolder = 'assets/';
        const gallery = document.getElementById('gallery');
        const imageCount = document.getElementById('imageCount');

        // Download icon SVG
        const downloadIcon = `<svg class="download-icon" viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>`;

        // Common image extensions
        const imageExtensions = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'JPG', 'JPEG', 'PNG'];

        // Function to create download button
        function createDownloadButton(imageUrl, fileName) {
            const button = document.createElement('button');
            button.className = 'download-btn';
            button.innerHTML = downloadIcon;
            button.title = 'Download';
            button.onclick = function(e) {
                e.stopPropagation();
                downloadImage(imageUrl, fileName);
            };
            return button;
        }

        // Function to download image
        function downloadImage(imageUrl, fileName) {
            const a = document.createElement('a');
            a.href = imageUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Function to display images
        function displayImages(images) {
            gallery.innerHTML = '';
            
            if (images.length === 0) {
                gallery.innerHTML = '<div class="loading">No images found in assets folder</div>';
                return;
            }
            
            // Update image count for SEO/User context
            imageCount.textContent = `Found ${images.length} Arch and Linux Ricing Wallpapers`;

            // Shuffle images for random order
            const shuffledImages = [...images].sort(() => Math.random() - 0.5);
            
            shuffledImages.forEach(image => {
                const card = document.createElement('div');
                card.className = 'wallpaper-card';
                
                const img = document.createElement('img');
                img.src = assetFolder + image;
                // SEO: Use a keyword-rich alt tag
                img.alt = 'Arch Linux Wallpaper ' + image.replace(/\..+$/, ''); 
                img.className = 'wallpaper-img';
                img.loading = 'lazy'; // Lazy loading for performance
                
                // Handle image errors
                img.onerror = function() {
                    console.log('Failed to load:', image);
                    card.style.display = 'none';
                };
                
                const downloadBtn = createDownloadButton(assetFolder + image, image);
                
                card.appendChild(img);
                card.appendChild(downloadBtn);
                gallery.appendChild(card);
            });
        }

        // --- Original Image Discovery Logic ---
        // (Keeping your original implementation for manifest/numbered discovery)

        async function tryServerDiscovery() {
            try {
                const response = await fetch('/api/images');
                const images = await response.json();
                return images;
            } catch (error) {
                return null;
            }
        }

        function discoverNumberedImages() {
            const discovered = [];
            
            const patterns = [
                'wallpaper{}.jpg', 'image{}.jpg', 'img{}.jpg', '{}.jpg',
                'wallpaper{}.png', 'image{}.png'
            ];
            
            let foundCount = 0;
            let batch = 1;
            
            function checkBatch() {
                const start = (batch - 1) * 100 + 1;
                const end = batch * 100;
                let checked = 0;
                
                for (let i = start; i <= end; i++) {
                    patterns.forEach(pattern => {
                        const filename = pattern.replace('{}', i);
                        checkImageExists(filename).then(exists => {
                            if (exists) {
                                discovered.push(filename);
                                foundCount++;
                            }
                            checked++;
                            
                            if (checked === patterns.length * 100) {
                                if (foundCount > 0 || batch < 10) {
                                    batch++;
                                    setTimeout(checkBatch, 100);
                                } else {
                                    displayImages(discovered);
                                }
                            }
                        });
                    });
                }
            }
            
            checkBatch();
        }

        async function loadFromManifest() {
            try {
                const response = await fetch('image-manifest.txt');
                const text = await response.text();
                const images = text.split('\n')
                    .map(line => line.trim())
                    .filter(line => line && imageExtensions.some(ext => line.toLowerCase().endsWith('.' + ext)));
                
                displayImages(images);
            } catch (error) {
                discoverNumberedImages();
            }
        }

        function checkImageExists(filename) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = assetFolder + filename;
            });
        }

        // Initialize gallery - try manifest first, then fallback
        loadFromManifest();
    </script>
