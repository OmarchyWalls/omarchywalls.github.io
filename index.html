<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>ArchImg - HD Linux Wallpaper Feed</title>
    <meta name="description" content="Download free 4K/HD wallpapers for Arch Linux, Hyprland, and Unixporn ricing. A pure, clean visual feed of minimalist desktop backgrounds.">
    <meta name="keywords" content="Linux wallpapers, Arch Linux background, Hyprland wallpaper, Unixporn, Ricing, 4K wallpapers, Minimalist desktop, Aesthetic, Visual feed">
    <meta name="author" content="ArchImg">
    <meta name="robots" content="index, follow">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        // Replace G-XXXXXXXXXX with your actual Measurement ID
        gtag('config', 'G-XXXXXXXXXX'); 
    </script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0a0a0a; /* Deep dark background */
        }

        /* Reset and Minimal Styling */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: #c0caf5;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-y: scroll; /* Ensure scrollbar is available */
        }

        /* --- Gallery Grid --- */
        .gallery {
            /* Minimal padding to make the images almost edge-to-edge */
            padding: 8px;
            
            display: grid;
            /* Responsive grid that adjusts column count */
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 8px; /* Small gap between images */
            
            max-width: 100%;
            margin: 0 auto;
        }
        
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 4px;
                padding: 4px;
            }
        }

        /* --- Image Card --- */
        .wallpaper-card {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16/9; /* Standard widescreen aspect ratio */
            cursor: pointer;
            transition: transform 0.2s;
        }

        .wallpaper-card:hover {
            /* Subtle hover effect on image, no text/border */
            transform: scale(1.01);
            z-index: 10;
        }

        .wallpaper-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- Download Button Overlay (Only visible on hover/tap) --- */
        .download-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 20;
        }

        .wallpaper-card:hover .download-btn {
            opacity: 1;
        }

        @media (max-width: 768px) {
            /* Always show button on mobile for better UX */
            .download-btn {
                opacity: 1;
                width: 32px;
                height: 32px;
                bottom: 8px;
                right: 8px;
            }
        }

        .download-btn:hover {
            background: white;
            transform: scale(1.1);
        }

        .download-icon {
            width: 20px;
            height: 20px;
            fill: #1a1a1f;
        }

        /* --- Loading/Status (Will be removed by JS once images load) --- */
        .loading {
            grid-column: 1 / -1;
            padding: 40px;
            text-align: center;
            color: transparent; /* Text is invisible */
        }
    </style>
</head>
<body>

    <div style="height: 0; overflow: hidden;">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="1234567890"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div class="gallery" id="gallery">
        <div class="loading">Loading Wallpapers...</div>
        </div>

    <script>
        const assetFolder = 'assets/'; 
        const gallery = document.getElementById('gallery');
        const imageExtensions = ['jpg', 'jpeg', 'png', 'webp', 'gif'];

        const downloadIcon = `<svg class="download-icon" viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>`;

        function downloadImage(imageUrl, fileName) {
            const a = document.createElement('a');
            a.href = imageUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function createDownloadButton(imageUrl, fileName) {
            const button = document.createElement('button');
            button.className = 'download-btn';
            button.innerHTML = downloadIcon;
            button.title = 'Download Wallpaper';
            button.onclick = function(e) {
                e.stopPropagation(); // Prevents image card click event
                downloadImage(imageUrl, fileName);
            };
            return button;
        }

        function displayImages(images) {
            gallery.innerHTML = ''; // Clear loading message
            
            if (images.length === 0) {
                 // No images found, but we hide the error text
                 gallery.innerHTML = '<div class="loading"></div>'; 
                return;
            }

            // Shuffle images for a fresh look on every load
            images.sort(() => Math.random() - 0.5);

            images.forEach(image => {
                const card = document.createElement('div');
                card.className = 'wallpaper-card';
                
                // Clicking the image starts the download directly
                card.onclick = () => downloadImage(assetFolder + image, image); 
                
                const img = document.createElement('img');
                img.src = assetFolder + image;
                img.alt = ''; // No alt text to keep UI clean, but use for accessibility if needed
                img.className = 'wallpaper-img';
                img.loading = 'lazy';

                img.onerror = function() {
                    card.style.display = 'none';
                };
                
                const downloadBtn = createDownloadButton(assetFolder + image, image);
                
                card.appendChild(img);
                card.appendChild(downloadBtn);
                gallery.appendChild(card);
            });
        }

        // --- Image Discovery Logic (Keeping the manifest/brute-force approach) ---
        
        async function loadFromManifest() {
            try {
                const response = await fetch('image-manifest.txt');
                if (!response.ok) throw new Error("No manifest");
                const text = await response.text();
                const images = text.split('\n')
                    .map(line => line.trim())
                    .filter(line => line && imageExtensions.some(ext => line.toLowerCase().endsWith('.' + ext)));
                displayImages(images);
            } catch (error) {
                discoverNumberedImages();
            }
        }

        function discoverNumberedImages() {
            const discovered = [];
            const patterns = ['{}.jpg', '{}.png', '{}.jpeg', '{}.webp'];
            let batch = 1;
            let maxChecks = 500; // Total number of attempts

            function checkBatch() {
                // Simplified, less aggressive brute-force check
                const start = (batch - 1) * 100 + 1;
                const end = batch * 100;
                let completed = 0;
                let pending = 0;

                for (let i = start; i <= end; i++) {
                    patterns.forEach(pattern => {
                        if (pending >= maxChecks) return;
                        pending++;

                        const filename = pattern.replace('{}', i);
                        const img = new Image();
                        
                        img.onload = () => {
                            discovered.push(filename);
                            checkCompletion();
                        };
                        img.onerror = () => {
                            checkCompletion();
                        };
                        img.src = assetFolder + filename;
                    });
                }

                function checkCompletion() {
                    completed++;
                    if (completed >= pending) {
                        // All checks in this batch done
                        if (discovered.length > 0 || batch < 3) { // Check a few batches
                            batch++;
                            setTimeout(checkBatch, 100);
                        } else {
                            displayImages(discovered);
                        }
                    }
                }
            }
            checkBatch();
        }

        // Initialize gallery
        loadFromManifest();
    </script>
</body>
</html>
