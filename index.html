<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .wallpaper-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            aspect-ratio: 16/9;
        }

        .wallpaper-card:hover {
            transform: scale(1.02);
        }

        .wallpaper-card:hover .download-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .wallpaper-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .download-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .download-btn:hover {
            background: white;
            transform: scale(1.1);
        }

        .download-icon {
            width: 20px;
            height: 20px;
        }

        .download-icon path {
            fill: #333;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            grid-column: 1 / -1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wallpaper-card {
            animation: fadeIn 0.5s ease;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 10px;
            }
            
            body {
                padding: 10px;
            }
            
            .download-btn {
                opacity: 1;
                transform: translateY(0);
                width: 35px;
                height: 35px;
            }
            
            .download-icon {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="gallery" id="gallery">
        <div class="loading">Loading images...</div>
    </div>

    <script>
        // Configuration - Update this with your actual image filenames
        const imageList = [
            "wallpaper1.jpg",
            "wallpaper2.jpg", 
            "wallpaper3.jpg",
            "wallpaper4.jpg",
            "wallpaper5.jpg",
            "wallpaper6.jpg"
        ];

        const assetFolder = 'assets/';
        const gallery = document.getElementById('gallery');

        // Download icon SVG
        const downloadIcon = `<svg class="download-icon" viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>`;

        // Function to create download button
        function createDownloadButton(imageUrl, fileName) {
            const button = document.createElement('button');
            button.className = 'download-btn';
            button.innerHTML = downloadIcon;
            button.onclick = function(e) {
                e.stopPropagation();
                
                // Trigger download
                const a = document.createElement('a');
                a.href = imageUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
            return button;
        }

        // Function to display images
        function displayImages(images) {
            gallery.innerHTML = '';
            
            if (images.length === 0) {
                gallery.innerHTML = '<div class="loading">No images found</div>';
                return;
            }
            
            // Shuffle images for random order
            const shuffledImages = [...images].sort(() => Math.random() - 0.5);
            
            shuffledImages.forEach(image => {
                const card = document.createElement('div');
                card.className = 'wallpaper-card';
                
                const img = document.createElement('img');
                img.src = assetFolder + image;
                img.alt = '';
                img.className = 'wallpaper-img';
                
                // Handle image errors
                img.onerror = function() {
                    card.style.display = 'none';
                };
                
                const downloadBtn = createDownloadButton(assetFolder + image, image);
                
                card.appendChild(img);
                card.appendChild(downloadBtn);
                gallery.appendChild(card);
            });
        }

        // Auto-discover images or use manual list
        async function loadImages() {
            // Use manual list if provided
            if (imageList.length > 0) {
                displayImages(imageList);
                return;
            }
            
            // Try to auto-discover images (basic approach)
            const discoveredImages = [];
            const testNames = [
                'wallpaper1.jpg', 'wallpaper2.jpg', 'wallpaper3.jpg',
                'image1.jpg', 'image2.jpg', 'bg1.png', 'bg2.png'
            ];
            
            for (const name of testNames) {
                try {
                    await new Promise((resolve, reject) => {
                        const img = new Image();
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = assetFolder + name;
                    });
                    discoveredImages.push(name);
                } catch (e) {
                    // Image doesn't exist, continue
                }
            }
            
            displayImages(discoveredImages);
        }

        // Initialize gallery
        loadImages();
    </script>
</body>
</html>
