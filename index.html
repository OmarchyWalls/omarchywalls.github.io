    <style>
        /* Existing CSS code remains the same */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: system-ui, sans-serif;
            padding: 10px;
            min-height: 100vh;
        }
        
        /* New subtle H1 styling for SEO */
        h1 {
            color: #444; /* Dark grey color to be subtle */
            font-size: 0.8rem;
            text-align: center;
            padding: 10px 0;
            margin-bottom: 5px;
            font-weight: 400;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 8px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .wallpaper-card {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
            aspect-ratio: 16/9;
        }

        .wallpaper-card:hover {
            transform: scale(1.03);
        }

        .wallpaper-card:hover .download-btn {
            opacity: 1;
        }

        .wallpaper-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .download-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background: white;
            transform: scale(1.1);
        }

        .download-icon {
            width: 16px;
            height: 16px;
        }

        .download-icon path {
            fill: #333;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            grid-column: 1 / -1;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .download-btn {
                opacity: 1;
            }
            
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 6px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .wallpaper-card {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>
    
    <h1>4K Arch Linux Wallpapers for Ricing and Desktop Customization</h1>

    <div class="controls">
        <span id="imageCount">Collection of HD Wallpapers for Linux, Arch, and Hyprland Setups</span>
    </div>
    
    <div class="gallery" id="gallery">
        <div class="loading">Discovering images...</div>
    </div>

    <script>
        const assetFolder = 'assets/';
        const gallery = document.getElementById('gallery');
        const imageCount = document.getElementById('imageCount');

        // Download icon SVG
        const downloadIcon = `<svg class="download-icon" viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>`;

        // Common image extensions
        const imageExtensions = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'JPG', 'JPEG', 'PNG'];

        // Function to create download button
        function createDownloadButton(imageUrl, fileName) {
            const button = document.createElement('button');
            button.className = 'download-btn';
            button.innerHTML = downloadIcon;
            button.title = 'Download Wallpaper';
            button.onclick = function(e) {
                e.stopPropagation();
                downloadImage(imageUrl, fileName);
            };
            return button;
        }

        // Function to download image
        function downloadImage(imageUrl, fileName) {
            const a = document.createElement('a');
            a.href = imageUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Function to display images
        function displayImages(images) {
            gallery.innerHTML = '';
            
            if (images.length === 0) {
                gallery.innerHTML = '<div class="loading">No images found in assets folder</div>';
                return;
            }
            
            imageCount.textContent = `Displaying ${images.length} High-Resolution Ricing Wallpapers`;
            
            // Shuffle images for random order
            const shuffledImages = [...images].sort(() => Math.random() - 0.5);
            
            shuffledImages.forEach(image => {
                const card = document.createElement('div');
                card.className = 'wallpaper-card';
                
                const img = document.createElement('img');
                img.src = assetFolder + image;
                
                // SEO: Add descriptive alt text using keywords and image filename
                const altText = 'Arch Linux wallpaper aesthetic ' + image.replace(/\..+$/, '').replace(/[-_]/g, ' '); 
                img.alt = altText;
                
                img.className = 'wallpaper-img';
                img.loading = 'lazy'; // Lazy loading for performance
                
                // Handle image errors
                img.onerror = function() {
                    console.log('Failed to load:', image);
                    card.style.display = 'none';
                };
                
                const downloadBtn = createDownloadButton(assetFolder + image, image);
                
                card.appendChild(img);
                card.appendChild(downloadBtn);
                gallery.appendChild(card);
            });
        }

        // Method 1: Try to get image list from a server endpoint (if you can create one)
        async function tryServerDiscovery() {
            try {
                // This would require a server-side component
                const response = await fetch('/api/images');
                const images = await response.json();
                return images;
            } catch (error) {
                return null;
            }
        }

        // Method 2: Use a predefined pattern for numbered images
        function discoverNumberedImages() {
            const discovered = [];
            
            // Check for common numbering patterns
            const patterns = [
                'wallpaper{}.jpg', 'image{}.jpg', 'img{}.jpg', '{}.jpg',
                'wallpaper{}.png', 'image{}.png'
            ];
            
            let foundCount = 0;
            let batch = 1;
            
            // Check in batches to avoid too many requests
            function checkBatch() {
                const start = (batch - 1) * 100 + 1;
                const end = batch * 100;
                let checked = 0;
                
                for (let i = start; i <= end; i++) {
                    patterns.forEach(pattern => {
                        const filename = pattern.replace('{}', i);
                        checkImageExists(filename).then(exists => {
                            if (exists) {
                                discovered.push(filename);
                                foundCount++;
                            }
                            checked++;
                            
                            if (checked === patterns.length * 100) {
                                // This batch is done
                                if (foundCount > 0 || batch < 10) { // Limit to 1000 images check
                                    batch++;
                                    setTimeout(checkBatch, 100);
                                } else {
                                    displayImages(discovered);
                                }
                            }
                        });
                    });
                }
            }
            
            checkBatch();
        }

        // Method 3: Create a manifest file (RECOMMENDED)
        // Create a simple text file listing all your images
        async function loadFromManifest() {
            try {
                const response = await fetch('image-manifest.txt');
                const text = await response.text();
                const images = text.split('\n')
                    .map(line => line.trim())
                    .filter(line => line && imageExtensions.some(ext => line.toLowerCase().endsWith('.' + ext)));
                
                displayImages(images);
            } catch (error) {
                // Fallback to numbered discovery
                discoverNumberedImages();
            }
        }

        // Helper function to check if image exists
        function checkImageExists(filename) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = assetFolder + filename;
            });
        }

        // Initialize gallery - try manifest first, then fallback
        loadFromManifest();
    </script>
</body>
